name: Windows build and localization tests

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6 soundcard soundfile numpy lameenc keyboard pyinstaller

      - name: Compile and test
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Package Windows executable
        run: pyinstaller --noconsole --onefile --name QuickAudioRecorder main.py

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickAudioRecorder-windows-test
          path: dist/QuickAudioRecorder.exe
          if-no-files-found: error
          retention-days: 1
